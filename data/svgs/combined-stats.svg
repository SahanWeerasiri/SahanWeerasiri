            </text>
            <text x="120" y="25" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Repositories</text>
        </g>
    </g>
    
    <!-- Languages Section -->
    <g transform="translate(50, 220)">
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#58a6ff">
