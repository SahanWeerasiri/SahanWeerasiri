                <rect x="200" y="10" width="0" height="10" rx="5" ry="5" fill="#3572A5">
                    <animate attributeName="width" values="0;48.08" dur="1s" begin="0s" fill="freeze"/>
                    <animate attributeName="width" values="48.08;48.08" dur="2s" begin="1s" fill="freeze"/>
                    <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="3s" repeatCount="indefinite"/>
                </rect>
            </g>
            
            <g transform="translate(0, 70)">
