                <rect x="200" y="10" width="0" height="10" rx="5" ry="5" fill="#b07219">
                    <animate attributeName="width" values="0;28.32" dur="1s" begin="0.3s" fill="freeze"/>
                    <animate attributeName="width" values="28.32;28.32" dur="2s" begin="1s" fill="freeze"/>
                    <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="3s" repeatCount="indefinite"/>
                </rect>
            </g>
            
            <g transform="translate(0, 110)">
                <!-- Language dot -->
                <circle cx="10" cy="15" r="6" fill="#6e7681">
                    <animate attributeName="r" values="6;8;6" dur="2s" begin="1s" repeatCount="indefinite"/>
                </circle>
                
                <!-- Language name -->
                <text x="25" y="20" font-family="Arial, sans-serif" font-size="14" fill="#f0f6fc">
                    Tcl
                </text>
                
                <!-- Percentage -->
                <text x="180" y="20" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">
                    10.17%
                </text>
                
                <!-- Mini progress bar -->
                <rect x="200" y="10" width="150" height="10" rx="5" ry="5" fill="#161b22"/>
                <rect x="200" y="10" width="0" height="10" rx="5" ry="5" fill="#6e7681">
                    <animate attributeName="width" values="0;20.34" dur="1s" begin="0.6s" fill="freeze"/>
                    <animate attributeName="width" values="20.34;20.34" dur="2s" begin="1s" fill="freeze"/>
                    <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="3s" repeatCount="indefinite"/>
                </rect>
            </g>
            
    </g>
    
    <!-- Contributed repos -->
    <g transform="translate(400, 220)">
        <rect width="350" height="120" rx="15" ry="15" fill="#21262d" stroke="#a371f7" stroke-width="2">
            <animate attributeName="stroke-width" values="2;3;2" dur="2s" begin="1s" repeatCount="indefinite"/>
        </rect>
        
        <text x="175" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#a371f7">
