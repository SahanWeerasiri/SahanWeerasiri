<svg width="800" height="280" viewBox="0 0 800 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal Window Background -->
  <rect width="800" height="280" rx="10" fill="#0a0d14"/>
  <rect x="0.5" y="0.5" width="799" height="279" rx="9.5" stroke="#1f2937"/>

  <!-- Window Control Buttons -->
  <circle cx="25" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="45" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="22" r="6" fill="#27c93f"/>

  <!-- Window Header Title -->
  <text x="400" y="26" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#64748b">sahan@kali-terminal: ~</text>
  <line x1="0" y1="38" x2="800" y2="38" stroke="#1f2937" stroke-width="1"/>

  <!-- Command 1: whoami -->
  <g transform="translate(25, 68)">
    <text font-family="'Courier New', Courier, monospace" font-size="13">
      <tspan fill="#00f5d4" font-weight="bold">sahan@sec-ops:~$</tspan>
      <tspan fill="#f8fafc"> whoami --verbose</tspan>
    </text>

    <!-- Vertical Accent Line -->
    <line x1="4" y1="14" x2="4" y2="120" stroke="#00f5d4" stroke-width="2" opacity="0.6"/>

    <g transform="translate(18, 0)">
      <text y="32" font-family="'Courier New', Courier, monospace" font-size="12.5">
        <tspan fill="#38bdf8" font-weight="bold">Identity       :</tspan>
        <tspan fill="#f1f5f9"> Sahan Weerasiri </tspan>
        <tspan fill="#94a3b8">(@SahanWeerasiri)</tspan>
      </text>

      <text y="54" font-family="'Courier New', Courier, monospace" font-size="12.5">
        <tspan fill="#38bdf8" font-weight="bold">Education      :</tspan>
        <tspan fill="#f1f5f9"> Undergraduate in Computer Science &amp; Engineering</tspan>
      </text>

      <text y="76" font-family="'Courier New', Courier, monospace" font-size="12.5">
        <tspan fill="#38bdf8" font-weight="bold">Specialization :</tspan>
        <tspan fill="#f1f5f9"> Cyber Security</tspan>
      </text>

      <text y="98" font-family="'Courier New', Courier, monospace" font-size="12.5">
        <tspan fill="#38bdf8" font-weight="bold">Repositories   :</tspan>
        <tspan fill="#f1f5f9"> 132 Total </tspan>
        <tspan fill="#94a3b8">(Public &amp; Private)</tspan>
      </text>

      <text y="120" font-family="'Courier New', Courier, monospace" font-size="12.5">
        <tspan fill="#38bdf8" font-weight="bold">Platform Age   :</tspan>
        <tspan fill="#f1f5f9"> Member Since April 2023</tspan>
      </text>
    </g>
  </g>

  <!-- Command 2: cat status -->
  <g transform="translate(25, 235)">
    <text font-family="'Courier New', Courier, monospace" font-size="13">
      <tspan fill="#00f5d4" font-weight="bold">sahan@sec-ops:~$</tspan>
      <tspan fill="#f8fafc"> cat /proc/status | grep State</tspan>
    </text>
    <text x="18" y="22" font-family="'Courier New', Courier, monospace" font-size="12" fill="#22c55e">
      State: ACTIVE (System Operational • Exploring Cyber Security &amp; Computing)
    </text>
  </g>
</svg>
